services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: firsthome-sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password2026
    ports:
      - "1433:1433"
    volumes:
      - firsthome_dbdata:/var/opt/mssql

volumes:
  firsthome_dbdata:
